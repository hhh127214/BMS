<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工商业储能 EMS · 运行平台</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<!-- ============================ 登录 ============================ -->
<div id="login-view" class="login-view">
  <div class="login-card">
    <div class="login-brand">
      <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true">
        <rect x="4" y="10" width="30" height="28" rx="4" fill="none" stroke="#2E6BE6" stroke-width="2.5"/>
        <rect x="34" y="18" width="8" height="12" rx="2" fill="#2E6BE6"/>
        <path d="M13 30 L19 20 L23 27 L27 16" fill="none" stroke="#22B07D" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1>工商业储能 EMS</h1>
        <p>运行监控平台 · 平台层 v1.0</p>
      </div>
    </div>

    <form id="login-form" autocomplete="on">
      <label class="field">
        <span>用户名</span>
        <input id="login-user" name="username" type="text" autocomplete="username" required>
      </label>
      <label class="field">
        <span>口令</span>
        <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn-primary" id="login-btn">登 录</button>
      <p id="login-err" class="login-err" role="alert"></p>
    </form>

    <div class="login-hint">
      <p>账号由平台后端（<code>14/</code>）的 <code>app_user</code> 表管理，初始口令由运维发放。</p>
      <p class="warn">本页不回填任何口令、也不列出演示账号；现场部署前必须改掉默认口令。</p>
    </div>
  </div>
  <p class="login-foot">站级监控 · 策略配置 · 告警与事件 · 收益核算 · 报表归档，一处入口</p>
</div>

<!-- ============================ 主界面 ============================ -->
<div id="app-view" class="app-view hidden">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 48 48" width="26" height="26" aria-hidden="true">
        <rect x="4" y="10" width="30" height="28" rx="4" fill="none" stroke="#2E6BE6" stroke-width="3"/>
        <rect x="34" y="18" width="8" height="12" rx="2" fill="#2E6BE6"/>
      </svg>
      <span>储能EMS运行平台</span>
      <button id="nav-toggle" class="nav-toggle" type="button" title="收起 / 展开侧边栏" aria-label="收起或展开侧边栏">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
          <rect x="2.75" y="4.25" width="14.5" height="11.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
          <path d="M11.8 7.7 L8.2 10 L11.8 12.3 Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="side-foot">
      <div class="side-user">
        <span class="avatar" id="user-avatar">A</span>
        <div>
          <div id="user-name">—</div>
          <div class="role" id="user-role">—</div>
        </div>
      </div>
      <button id="logout-btn" class="btn-ghost">退出登录</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <label class="search" for="nav-search">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="nav-search" type="text" placeholder="搜索页面，回车跳转…" autocomplete="off">
      </label>
      <div class="topbar-right">
        <!-- ★ 数据源由平台后端按当前采集状态决定（/api/engine 的 scenario），
             界面**不提供**数据集选择器 —— "看哪份演示场景"是研发调试概念，不是产品功能。
             顶栏这里只留业务维度：运行模式（峰谷套利 / 削峰填谷 / 辅助服务 / 保电备电）。 -->
        <div class="seg" id="mode-seg" role="tablist" aria-label="运行模式切换"></div>
      </div>
    </header>

    <div class="page-head">
      <h1 id="page-title">总览</h1>
      <p id="page-sub">—</p>
      <span id="live-badge" class="live-badge hidden" role="status"></span>
    </div>

    <section id="content" class="content"></section>
    <footer class="foot">
      <span id="foot-left">—</span>
      <span id="foot-right"></span>
    </footer>
  </main>
</div>

<div id="toast" class="toast hidden"></div>

<script src="assets/api.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/assembly.js"></script>
<script src="assets/pages.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
